name: AccessibleVision
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: com.zzypiano
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: AccessibleVision
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GREEN_CLOUD_BASE_URL: "https://google.example.invalid"
    ALIYUN_BASE_URL: "https://aliyun.example.invalid"
targets:
  AccessibleVision:
    type: application
    platform: iOS
    sources:
      - path: AccessibleVision
        excludes:
          - ScreenShare/ScreenRuntimeAdapter.js
      - path: ScreenShareShared
    dependencies:
      - target: ScreenBroadcastExtension
        embed: true
      - framework: LocalScreeningFramework/llama.xcframework
        embed: true
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: CoreML.framework
    info:
      path: AccessibleVision/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        CFBundleDisplayName: "实时慧眼"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.zzypiano.accessiblevision.screen-share
            CFBundleURLSchemes:
              - huiyan-screen
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "实时慧眼需要使用后置摄像头识别环境和寻找物品。"
        NSMicrophoneUsageDescription: "实时慧眼需要使用麦克风接收你的任务和问题。"
        NSLocationWhenInUseUsageDescription: "实时慧眼只在导航期间使用你的位置，用于路线跟随、转弯提醒和偏航判断。"
        GreenCloudBaseURL: "$(GREEN_CLOUD_BASE_URL)"
        AliyunBaseURL: "$(ALIYUN_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzypiano.accessiblevision.dev
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: AccessibleVision/LocalScreening/LocalScreening-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CODE_SIGN_ENTITLEMENTS: AccessibleVision/LocalScreening/LocalScreening.entitlements
  ScreenBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenBroadcastExtension
      - path: ScreenShareShared
    info:
      path: ScreenBroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: "慧眼屏幕共享"
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_NAME: ScreenBroadcastExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.zzypiano.accessiblevision.dev.screenbroadcast
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  AccessibleVision:
    build:
      targets:
        AccessibleVision: all
