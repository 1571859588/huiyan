<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>慧眼 · 开源视觉助手</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="hero">
      <h1>慧眼 · 开源视觉助手</h1>
      <div id="health" class="status-card" aria-live="off" hidden></div>
    </header>

    <main id="main" class="layout">
      <section class="panel" hidden inert>
        <h2 id="route-title">2. 规划路线</h2>

        <label for="city">城市</label>
        <input id="city" value="上海" autocomplete="address-level2">

        <label for="origin">起点地点或坐标</label>
        <input id="origin" placeholder="例如：起点名称，或 121.000000,31.000000">

        <div class="button-row">
          <button id="use-location" type="button">用手机当前位置做起点</button>
          <button id="search-origin" type="button">搜索起点</button>
        </div>

        <label for="destination">终点地点或坐标</label>
        <input id="destination" placeholder="例如：目的地名称或完整地址">

        <div class="button-row">
          <button id="search-destination" type="button">搜索终点</button>
        </div>

        <div id="poi-status" class="ready-note" aria-live="assertive"></div>

        <div
          id="poi-results"
          class="results"
          role="region"
          aria-live="assertive"
          aria-label="地点搜索结果"
          tabindex="-1"
        ></div>

        <label for="mode">路线类型</label>
        <select id="mode">
          <option value="transit">公交加步行</option>
          <option value="walking">只规划步行</option>
        </select>

        <button id="plan-route" class="primary" type="button">生成路线</button>
      </section>

      <section class="panel" hidden>
        <h2 id="manual-route-title">1.5 无 Key 测试路线</h2>
        <p class="hint">
          如果暂时没有高德 Web 服务 Key，可以把我通过高德 MCP 或人工核对得到的路线事实粘贴到这里。实时慧眼会把这段内容当作当前导航状态使用。
        </p>
        <label for="manual-route">手动路线事实</label>
        <textarea id="manual-route" rows="9" placeholder="例如：起点、终点、公交线路、上车站、下车站、下车后需要找的入口、不能确认的点。"></textarea>
        <button id="load-manual-route" class="primary" type="button">载入手动路线</button>
      </section>

      <section class="panel" hidden inert>
        <h2 id="route-output-title">3. 路线结果</h2>
        <button id="speak-route" type="button">朗读路线结果</button>
        <pre id="route-output" class="output" tabindex="0" aria-live="off">还没有生成路线。</pre>
        <div class="button-row" aria-label="GPS 跟随播报">
          <button id="start-follow" class="primary" type="button">开始 GPS 跟随播报</button>
          <button id="stop-follow" type="button">停止 GPS 跟随播报</button>
        </div>
        <pre id="follow-output" class="output compact-output" tabindex="0" aria-live="off">还没有开始 GPS 跟随。</pre>
      </section>

      <section class="panel camera-panel">
        <h2 id="camera-title">1. 实时慧眼</h2>

        <div hidden>
          <label for="realtime-mode">实时接入方式</label>
          <select id="realtime-mode">
            <option value="webrtc" selected>WebRTC 通话，演示推荐</option>
            <option value="websocket">WebSocket Manual，静默上下文实验</option>
          </select>
        </div>

        <p id="realtime-config-status" class="ready-note" aria-live="off" hidden></p>
        <p id="active-reminder-status" class="ready-note" aria-hidden="true" hidden></p>

        <div hidden>
          <details id="advanced-realtime-config" class="advanced-config">
            <summary>高级调试：临时覆盖百炼 Key 和 Endpoint</summary>
            <p class="hint">
              正常测试不用填写这里。只有后台 Key 或 Endpoint 失效时，才展开这里临时覆盖。
            </p>
            <label for="client-api-key">百炼 DashScope Key，临时测试用</label>
            <input id="client-api-key" type="password" autocomplete="off" placeholder="只保存在当前手机浏览器，不会写入服务器">
            <label for="client-webrtc-endpoint">百炼 WebRTC Endpoint，临时测试用</label>
            <input id="client-webrtc-endpoint" type="text" autocomplete="off" placeholder="例如 llm-业务空间ID.cn-beijing.maas.aliyuncs.com">
            <div class="button-row">
              <button id="save-client-key" type="button">保存 Key 和 Endpoint 到本机</button>
              <button id="clear-client-key" type="button">清除本机 Key 和 Endpoint</button>
            </div>
          </details>
        </div>

        <div hidden>
          <label for="vision-question">当前确认目标</label>
          <select id="vision-question">
            <option value="请像视频通话一样持续观察，重点帮我确认目的地入口、门牌和招牌。">确认目的地入口</option>
            <option value="请像视频通话一样持续观察，重点帮我确认公交站牌和站名。">确认公交站牌</option>
            <option value="请持续观察画面，重点找门牌号、招牌或医院门诊入口。">找门牌或招牌</option>
            <option value="请结合导航状态和画面，判断目标大概在左前方、右前方还是正前方。">确认目标方向</option>
            <option value="请进行静默视觉记忆测试：从现在开始始终保持观察工作状态，即使我不说话也不要停止识别。等我稍后问刚才看到了什么时，只能根据静默期间真实看到过的画面回答，不确定就说不确定。">静默视觉记忆测试</option>
            <option value="测试主动提醒：用于验证主动提醒触发后交给汇演 RTC 播报。">测试主动提醒</option>
          </select>
        </div>

        <div class="button-row">
          <button id="start-unified-visual-assistant" class="primary" type="button">实时慧眼（Google声音）</button>
          <button id="start-browser-direct-unified-assistant" type="button" hidden>实时慧眼（手机直连筛图）</button>
          <button id="start-aliyun-unified-visual-assistant" type="button">实时慧眼（阿里声音）</button>
          <button id="start-aliyun-cheap-unified-visual-assistant" type="button">实时慧眼（阿里实时视频实验）</button>
          <button id="start-realtime" type="button" hidden>阿里稳定主动提醒</button>
          <button id="start-speed-active-reminder" type="button" hidden>阿里实验主动提醒</button>
          <button id="start-gemini-active-reminder" type="button" hidden>Gemini 稳定主动提醒</button>
          <button id="start-gemini-observation-active-reminder" type="button" hidden>Gemini 实验主动提醒</button>
          <button id="start-gemini-contract-active-reminder" type="button" hidden>Gemini 合同实验</button>
          <button id="start-gemini-lite-contract-active-reminder" type="button" hidden>Gemini Lite 合同对比</button>
          <button id="start-gemini-find-object" type="button" hidden>Gemini 找东西实验</button>
          <button id="start-gemini-continuous-narration" type="button" hidden>持续播报</button>
          <button id="stop-realtime" type="button">结束实时慧眼</button>
        </div>

        <details class="advanced-config">
          <summary>故障诊断工具</summary>
          <div class="button-row">
            <button id="send-context" type="button">发送当前导航上下文</button>
            <button id="commit-silent-context" type="button">提交静默画面</button>
            <button id="commit-and-respond" type="button">用静默画面回答</button>
            <button id="check-silent-video" type="button">检查视频推送</button>
            <button id="speak-vision" type="button">朗读确认结果</button>
            <button id="copy-realtime-log" type="button">复制本轮日志</button>
          </div>
          <pre id="vision-output" class="output" aria-live="off"></pre>
        </details>

        <label class="checkbox-line">
          <input id="strong-echo-guard" type="checkbox">
          强防回声
        </label>
        <video id="camera" playsinline muted aria-label="本地摄像头预览"></video>
        <canvas id="video-frame" hidden></canvas>
        <audio id="remote-audio" autoplay></audio>
      </section>
    </main>

    <script src="/live-web-search.js"></script>
    <script src="/client-access.js?v=20261008.2"></script>
    <script src="/huiyan-model-layers.js?v=20261023.2"></script>
    <script src="/local-screen-search.js?v=20261024.1"></script>
    <script src="/app.js?v=20261024.local-search"></script>
  </body>
</html>
